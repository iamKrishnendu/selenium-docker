services:
  selenium:
    image: selenium/standalone-chrome:4.18.1
    container_name: selenium
    ports:
      - "4444:4444"
    shm_size: 2g

  jenkins:
    image: jenkins/jenkins:lts
    container_name: jenkins
    ports:
      - "8080:8080"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - selenium

volumes:
  jenkins_home: